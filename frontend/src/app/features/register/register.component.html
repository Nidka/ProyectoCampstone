<div class="login-wrap register-wrap">

  <div class="login-bg">
    <div class="login-orb orb-1"></div>
    <div class="login-orb orb-2"></div>
    <div class="login-grid"></div>
  </div>

  <div class="login-card register-card">

    <div class="login-logo">
      <div class="login-logo-badge">
        <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="14" height="13" rx="2"/>
          <path d="M15 9h4.5L22 13v4h-7V9z"/>
          <circle cx="5.5" cy="19.5" r="2.5"/>
          <circle cx="18.5" cy="19.5" r="2.5"/>
        </svg>
      </div>
      <div>
        <div class="login-brand">LIZAR SRL</div>
        <div class="login-sub">Fleet Manager Pro</div>
      </div>
    </div>

    <h1 class="login-title">Crear usuario</h1>
    <p class="login-desc">Registra una cuenta para acceder al sistema</p>

    @if (error()) {
      <div class="login-error">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error() }}
      </div>
    }

    <form class="login-form register-form" (ngSubmit)="submit()">
      <div class="register-grid">
        <div class="login-field">
          <label for="nombre">Nombre</label>
          <div class="login-input-wrap">
            <span class="login-input-ico">
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
              </svg>
            </span>
            <input id="nombre" type="text" [(ngModel)]="nombre" name="nombre" placeholder="Nombre completo" autocomplete="name" [disabled]="loading()" />
          </div>
        </div>

        <div class="login-field">
          <label for="username">Usuario</label>
          <div class="login-input-wrap">
            <span class="login-input-ico">
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M4 4h16v16H4z"/><path d="M9 9h6M9 13h6"/>
              </svg>
            </span>
            <input id="username" type="text" [(ngModel)]="username" name="username" placeholder="Ej: operador01" autocomplete="username" [disabled]="loading()" />
          </div>
        </div>
      </div>

      <div class="login-field">
        <label for="email">Email</label>
        <div class="login-input-wrap">
          <span class="login-input-ico">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/>
            </svg>
          </span>
          <input id="email" type="email" [(ngModel)]="email" name="email" placeholder="usuario@empresa.com" autocomplete="email" [disabled]="loading()" />
        </div>
      </div>

      <div class="register-grid">
        <div class="login-field">
          <label for="password">Contraseña</label>
          <div class="login-input-wrap">
            <span class="login-input-ico">
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
              </svg>
            </span>
            <input id="password" [type]="showPass() ? 'text' : 'password'" [(ngModel)]="password" name="password" placeholder="Mínimo 6 caracteres" autocomplete="new-password" [disabled]="loading()" />
          </div>
        </div>

        <div class="login-field">
          <label for="confirmPassword">Confirmar</label>
          <div class="login-input-wrap">
            <span class="login-input-ico">
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="m20 6-11 11-5-5"/>
              </svg>
            </span>
            <input id="confirmPassword" [type]="showPass() ? 'text' : 'password'" [(ngModel)]="confirmPassword" name="confirmPassword" placeholder="Repite contraseña" autocomplete="new-password" [disabled]="loading()" />
          </div>
        </div>
      </div>

      <label class="register-check">
        <input type="checkbox" [checked]="showPass()" (change)="showPass.set(!showPass())" [disabled]="loading()" />
        Mostrar contraseñas
      </label>

      <button class="login-btn" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="login-spinner"></span>
          Creando usuario...
        } @else {
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M12 5v14M5 12h14"/>
          </svg>
          Crear cuenta
        }
      </button>

    </form>

    <div class="login-link-row">
      <span>¿Ya tienes cuenta?</span>
      <a [routerLink]="['/login']">Iniciar sesión</a>
    </div>

  </div>

  <div class="login-footer">LIZAR SRL · Fleet Manager Pro · Lima, Perú · 2025</div>

</div>
