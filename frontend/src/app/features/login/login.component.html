<div class="login-wrap">

  <!-- BG decorativo -->
  <div class="login-bg">
    <div class="login-orb orb-1"></div>
    <div class="login-orb orb-2"></div>
    <div class="login-grid"></div>
  </div>

  <!-- Card -->
  <div class="login-card">

    <!-- Logo -->
    <div class="login-logo">
      <div class="login-logo-badge">
        <svg width="26" height="26" fill="none" viewBox="0 0 24 24" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1" y="4" width="14" height="13" rx="2"/>
          <path d="M15 9h4.5L22 13v4h-7V9z"/>
          <circle cx="5.5" cy="19.5" r="2.5"/>
          <circle cx="18.5" cy="19.5" r="2.5"/>
        </svg>
      </div>
      <div>
        <div class="login-brand">LIZAR SRL</div>
        <div class="login-sub">Fleet Manager Pro</div>
      </div>
    </div>

    <h1 class="login-title">Iniciar sesión</h1>
    <p class="login-desc">Ingresa tus credenciales para acceder al sistema</p>

    <!-- Error -->
    @if (error()) {
      <div class="login-error">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        {{ error() }}
      </div>
    }

    <form class="login-form" (ngSubmit)="submit()">
      <div class="login-field">
        <label for="username">Usuario</label>
        <div class="login-input-wrap">
          <span class="login-input-ico">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>
            </svg>
          </span>
          <input
            id="username"
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="Ej: admin"
            autocomplete="username"
            [disabled]="loading()"
          />
        </div>
      </div>

      <div class="login-field">
        <label for="password">Contraseña</label>
        <div class="login-input-wrap">
          <span class="login-input-ico">
            <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
              <rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </span>
          <input
            id="password"
            [type]="showPass() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            autocomplete="current-password"
            [disabled]="loading()"
          />
          <button type="button" class="login-eye" (click)="showPass.set(!showPass())" tabindex="-1">
            @if (showPass()) {
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            } @else {
              <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            }
          </button>
        </div>
      </div>

      <button class="login-btn" type="submit" [disabled]="loading()">
        @if (loading()) {
          <span class="login-spinner"></span>
          Verificando…
        } @else {
          <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.5" stroke-linecap="round">
            <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/><polyline points="10 17 15 12 10 7"/><line x1="15" y1="12" x2="3" y2="12"/>
          </svg>
          Ingresar al sistema
        }
      </button>

    </form>

    <div class="login-hint">
      <span>Usuario por defecto:</span>
      <code>admin</code> / <code>admin123</code>
    </div>

    <div class="login-link-row">
      <span>¿Necesitas una cuenta?</span>
      <a [routerLink]="['/register']">Crear usuario</a>
    </div>

  </div>

  <!-- Footer -->
  <div class="login-footer">LIZAR SRL · Fleet Manager Pro · Lima, Perú · 2025</div>

</div>
