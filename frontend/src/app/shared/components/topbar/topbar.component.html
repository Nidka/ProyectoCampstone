<div class="head">
  <!-- Back to landing -->
  <a href="/" class="tb-back-link" style="display:flex;align-items:center;gap:6px;color:var(--t4);font-size:.78rem;font-weight:500;text-decoration:none;margin-right:8px;transition:color .15s">
    <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
    Inicio
  </a>

  <!-- Search -->
  <div class="head-search">
    <span class="head-search-ico">
      <svg width="13" height="13" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
    </span>
    <input type="search" [(ngModel)]="searchTerm" placeholder="Buscar módulo, registro…"/>
  </div>

  <!-- Right -->
  <div class="head-icons">
    <div class="api-chip" [class.dead]="!health.connected" (click)="api.checkHealth()" title="Estado del sistema">
      <span class="live-dot"></span>
      <span>{{ health.connected ? 'Sistema en linea' : 'Servicio no disponible' }}</span>
    </div>

    <!-- Refresh -->
    <button class="head-icon-btn" (click)="refresh()" title="Actualizar todo">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <polyline points="23 4 23 10 17 10"/>
        <polyline points="1 20 1 14 7 14"/>
        <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"/>
      </svg>
    </button>

    <!-- User -->
    <div class="usr-chip">
      <div class="usr-av">{{ usuario()?.nombre?.slice(0,2)?.toUpperCase() ?? 'US' }}</div>
      <div style="display:flex;flex-direction:column;line-height:1.2">
        <span class="usr-chip-name">{{ usuario()?.nombre ?? 'Usuario' }}</span>
        <span style="font-size:.6rem;color:var(--t4);text-transform:uppercase;letter-spacing:.06em">{{ usuario()?.rol ?? '' }}</span>
      </div>
    </div>

    <!-- Logout -->
    <button class="head-icon-btn" (click)="logout()" title="Cerrar sesión" style="color:var(--err)">
      <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
        <polyline points="16 17 21 12 16 7"/>
        <line x1="21" y1="12" x2="9" y2="12"/>
      </svg>
    </button>
  </div>
</div>
