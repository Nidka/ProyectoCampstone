services:
  db:
    image: postgres:16-alpine
    container_name: lizar-demo-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: lizar_demo
      POSTGRES_USER: lizar
      POSTGRES_PASSWORD: lizar_demo_pass
    volumes:
      - lizar_demo_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U lizar -d lizar_demo"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./backend
    container_name: lizar-demo-api
    restart: unless-stopped
    env_file:
      - ./backend/.env.demo
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"

volumes:
  lizar_demo_pgdata:
